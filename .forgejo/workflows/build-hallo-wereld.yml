on:
  push:
    branches: [main]
    paths: ["apps/hallo-wereld/**"]

jobs:
  build-and-push:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Docker-CLI installeren
        run: apt-get update && apt-get install -y --no-install-recommends docker.io

      - name: Inloggen bij Zot
        run: |
          echo "${{ secrets.ZOT_PASSWORD }}" | docker login registry.argotal.com -u ruud --password-stdin

      - name: Image bouwen en taggen met de commit-SHA
        run: |
          docker build -t registry.argotal.com/hallo-wereld:${{ github.sha }} apps/hallo-wereld/
          docker tag registry.argotal.com/hallo-wereld:${{ github.sha }} registry.argotal.com/hallo-wereld:latest

      # Toe te voegen in het bestaande workflow-bestand, na de 'docker build'-stap
      - name: Image scannen op kwetsbaarheden (Trivy)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/ \
            aquasec/trivy:0.74.0 image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            registry.argotal.com/hallo-wereld:${{ github.sha }}

      - name: Image pushen naar Zot
        run: |
          docker tag hallo-wereld:${{ github.sha }} registry.argotal.com/hallo-wereld:${{ github.sha }}
          docker push registry.argotal.com/hallo-wereld:${{ github.sha }}