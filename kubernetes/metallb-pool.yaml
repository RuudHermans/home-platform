apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: thuisnetwerk-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.2.20-192.168.2.29
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: thuisnetwerk-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - thuisnetwerk-pool
