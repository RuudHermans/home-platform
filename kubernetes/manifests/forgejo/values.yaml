persistence:
  enabled: true
  size: 20Gi
  storageClass: local-path

gitea:  # de Forgejo Helm-chart hergebruikt (bewust) veel Gitea-conventies uit haar herkomst
  admin:
    existingSecret: ""   # laat leeg; je stelt het admin-account in via de eerste-keer-setup in stap 5
  config:
    database:
      DB_TYPE: sqlite3
    server:
      DOMAIN: git.argotal.com
      ROOT_URL: https://git.argotal.com/
      SSH_DOMAIN: git.argotal.com
    actions:
      enabled: true

service:
  http:
    type: ClusterIP 
  ssh:
    type: LoadBalancer   # krijgt een eigen IP van MetalLB, uitsluitend voor git-over-SSH

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 1Gi

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: git.argotal.com
      paths:
        - path: /
          pathType: Prefix
