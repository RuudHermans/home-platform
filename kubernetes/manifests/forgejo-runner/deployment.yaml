apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo
spec:
  replicas: 1
  selector:
    matchLabels: {app: forgejo-runner}
  template:
    metadata:
      labels: {app: forgejo-runner}
    spec:
      containers:
        - name: runner
          image: data.forgejo.org/forgejo/runner:13
          command: ["forgejo-runner", "daemon", "--config", "/data/config.yaml"]
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2376
            - name: DOCKER_CERT_PATH
              value: /certs/client
            - name: DOCKER_TLS_VERIFY
              value: "1"
          volumeMounts:
            - {name: certs, mountPath: /certs}
            - {name: runner-config, mountPath: /data/config.yaml, subPath: config.yaml}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
        - name: dind
          image: docker:24-dind
          securityContext:
            privileged: true   # noodzakelijk voor Docker-in-Docker; blijft beperkt tot deze ene pod
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
          volumeMounts:
            - {name: certs, mountPath: /certs}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {memory: 2Gi}
      volumes:
        - {name: certs, emptyDir: {}}
        - {name: runner-config, secret: {secretName: forgejo-runner-config}}
