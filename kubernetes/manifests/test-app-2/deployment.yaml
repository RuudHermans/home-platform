apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app-2
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-app-2
  template:
    metadata:
      labels:
        app: test-app-2
    spec:
      containers:
        - name: test-app-2
          image: nginxdemos/hello:latest
