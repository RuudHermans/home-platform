apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zot-data
  namespace: zot
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-config
  namespace: zot
data:
  config.json: |
    {
      "storage": {"rootDirectory": "/var/lib/registry", "dedupe": false},
      "http": {"address": "0.0.0.0", "port": "5000",
        "auth": {"htpasswd": {"path": "/etc/zot/htpasswd"}}},
        "compat": ["docker2s2"]}
      "log": {"level": "info"}
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot
  namespace: zot
spec:
  replicas: 1
  selector:
    matchLabels: {app: zot}
  template:
    metadata:
      labels: {app: zot}
    spec:
      containers:
        - name: zot
          image: ghcr.io/project-zot/zot:latest
          ports: [{containerPort: 5000}]
          volumeMounts:
            - {name: data, mountPath: /var/lib/registry}
            - {name: config, mountPath: /etc/zot/config.json, subPath: config.json}
            - {name: htpasswd, mountPath: /etc/zot/htpasswd, subPath: htpasswd}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: zot-data}}
        - {name: config, configMap: {name: zot-config}}
        - {name: htpasswd, secret: {secretName: zot-htpasswd}}
---
apiVersion: v1
kind: Service
metadata:
  name: zot
  namespace: zot
spec:
  selector: {app: zot}
  ports: [{port: 5000, targetPort: 5000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zot
  namespace: zot
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: registry.argotal.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: zot, port: {number: 5000}}
