apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-app
  namespace: platform-argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RuudHermans/home-platform.git
    targetRevision: main
    path: kubernetes/manifests/test-app
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
