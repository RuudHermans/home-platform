apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: platform-argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # verwijderen via Git ruimt ook de resources op (zie Fase 1, stap 8)
spec:
  project: default
  source:
    repoURL: https://bitnami-labs.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: "2.16.1"   # controleer de actuele versie via artifacthub.io
    helm:
      releaseName: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
