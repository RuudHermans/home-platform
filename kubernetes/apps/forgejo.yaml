apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: oci://code.forgejo.org/forgejo-helm
    chart: forgejo
    targetRevision: "17.1.7"
    helm:
      valueFiles:
        - $values/kubernetes/manifests/forgejo/values.yaml
  sources:
    - repoURL: oci://code.forgejo.org/forgejo-helm
      chart: forgejo
      targetRevision: "17.1.7"
      helm:
        valueFiles:
          - $values/kubernetes/manifests/forgejo/values.yaml
    - repoURL: https://github.com/RuudHermans/home-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
