apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-app-2
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<jouw-gebruikersnaam>/thuisopstelling-platform.git
    targetRevision: main
    path: kubernetes/manifests/test-app-2
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
