configs:
  params:
    server.insecure: true   # nodig omdat TLS straks bij Cloudflare eindigt, niet bij Argo CD zelf — zie de toelichting bij stap 4

redis-ha:
  enabled: false

controller:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 512Mi

server:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

applicationSet:
  replicas: 1
